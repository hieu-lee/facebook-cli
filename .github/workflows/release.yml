name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: fb-x86_64-linux }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: fb-aarch64-linux }
          - { os: macos-15-intel, target: x86_64-apple-darwin, asset: fb-x86_64-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: fb-aarch64-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: fb-x86_64-windows }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.asset }}.tar.gz -C target/${{ matrix.target }}/release fb
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/fb.exe -DestinationPath ${{ matrix.asset }}.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          fail_on_unmatched_files: false
