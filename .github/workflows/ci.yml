name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/js.test.js
      - run: node tests/media.test.js
      - run: node -e "for (const f of require('fs').readdirSync('js')) require('child_process').execFileSync(process.execPath, ['--check', 'js/' + f])"
      - run: node tests/e2e-isolation.mjs
        env:
          CHROME: ${{ runner.os == 'Linux' && 'google-chrome' || runner.os == 'macOS' && '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' || 'C:\Program Files\Google\Chrome\Application\chrome.exe' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ runner.os }}
          path: target/e2e
